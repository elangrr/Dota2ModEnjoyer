[package]
name = "dme-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crc32fast = "1.5.5"
ed25519-compact = { version = "2.6.1", default-features = false, features = ["random", "std"] }
md-5 = "0.11.0"
memchr = "2.8.3"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
